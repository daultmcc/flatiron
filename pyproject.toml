[project]
name = "flatiron"
version = "0.1.0"
description = "By-ear headphone resonance EQ from forced-choice loudness judgments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sounddevice>=0.4.6",
]

[project.scripts]
flatiron = "flatiron.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatiron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
